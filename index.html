<!DOCTYPE html>

<head>

<title>Try Out TKA Matematika 2026</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f6fb;--card:#fff;--tx:#18202e;--mu:#5c6b82;--pr:#1d6fd8;--prs:#e6f0fd;--ok:#14803c;--oks:#e3f5e9;--bad:#c62828;--bads:#fdeaea;--wa:#b26a00;--was:#fff3dc;--bd:#d6deea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1520;--card:#182131;--tx:#e8edf6;--mu:#9aa9c0;--pr:#5aa2ff;--prs:#1b2e4d;--ok:#4cc27a;--oks:#14301f;--bad:#ff7b7b;--bads:#3a1b1b;--wa:#f0b24a;--was:#3a2d12;--bd:#2c3a52}}
:root[data-theme="dark"]{--bg:#0f1520;--card:#182131;--tx:#e8edf6;--mu:#9aa9c0;--pr:#5aa2ff;--prs:#1b2e4d;--ok:#4cc27a;--oks:#14301f;--bad:#ff7b7b;--bads:#3a1b1b;--wa:#f0b24a;--was:#3a2d12;--bd:#2c3a52}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
h1{font-size:1.5rem;margin:.2em 0}h2{font-size:1.15rem;margin:.2em 0 .6em}
.mu{color:var(--mu);font-size:.92rem}
.btn{border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer;background:var(--pr);color:#fff}
.btn.g{background:var(--prs);color:var(--pr)}.btn.w{background:var(--was);color:var(--wa)}.btn:disabled{opacity:.4}
input[type=text]{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tm{font-weight:700;font-variant-numeric:tabular-nums;color:var(--pr)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-bottom:14px}
.gn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:7px 0;font:inherit;font-weight:600;cursor:pointer}
.gn.d{background:var(--prs);border-color:var(--pr);color:var(--pr)}.gn.f{background:var(--was);border-color:var(--wa);color:var(--wa)}.gn.c{outline:2px solid var(--pr)}
.gn.ok{background:var(--oks);border-color:var(--ok);color:var(--ok)}.gn.bad{background:var(--bads);border-color:var(--bad);color:var(--bad)}
.tag{display:inline-block;background:var(--prs);color:var(--pr);border-radius:20px;padding:2px 10px;font-size:.8rem;font-weight:600}
.q{margin:10px 0 14px}.op{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--bd);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}
.op b{min-width:22px;height:22px;border-radius:50%;border:1.5px solid var(--mu);display:inline-flex;align-items:center;justify-content:center;font-size:.8rem}
.op.sel{border-color:var(--pr);background:var(--prs)}.op.ok{border-color:var(--ok);background:var(--oks)}.op.bad{border-color:var(--bad);background:var(--bads)}.op.miss{border-color:var(--wa);background:var(--was)}
.row{border:1px solid var(--bd);border-radius:10px;padding:10px;margin:8px 0}.ch{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}.ch .op{margin:0;padding:6px 14px}
.nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.score{font-size:3rem;font-weight:800;color:var(--pr);line-height:1}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
.ex{background:var(--prs);border-radius:10px;padding:10px 12px;margin-top:10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.ov .card{max-width:380px}.hid{display:none}
.hero{text-align:center;padding:22px 10px;margin:-18px -18px 14px;border-radius:14px 14px 0 0;background:linear-gradient(135deg,#1d6fd8,#0b3f8f);color:#fff}.hero h1{font-size:1.75rem;line-height:1.25;letter-spacing:.5px;margin:10px 0 0}.hero .tag{background:rgba(255,255,255,.2);color:#fff}
.lb{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
.kt{width:100%;border-collapse:collapse;font-size:.93rem}.kt th,.kt td{border-bottom:1px solid var(--bd);padding:8px 6px;text-align:left}.kt th{color:var(--mu);font-size:.82rem}.kt td:last-child,.kt th:last-child{text-align:center}
</style>
</head>

<script>
var L=["A","B","C","D","E"];
var Q=[
{b:"Bilangan",t:"m",q:"Berilah tanda centang pada pernyataan yang <b>benar</b>! (jawaban boleh lebih dari satu)",o:["Hasil dari 5 × 72 − (10 + 20) : 6 = 355","Hasil dari 114 − (−72) × 3 + 68 = 398","Hasil dari −43 + 28 : (−4) + 75 = 25","Hasil dari 52 − 13 × 5 + (−29) = 42","Hasil dari 103 + (−15) × 4 − (−22) = 75"],a:[0,1,2],e:"360 − 5 = 355 ✓. 114 + 216 + 68 = 398 ✓. −43 + (−7) + 75 = 25 ✓. 52 − 65 − 29 = −42 (bukan 42). 103 − 60 + 22 = 65 (bukan 75)."},
{b:"Aritmetika Sosial",t:"tf",l:["Setuju","Tidak Setuju"],q:"Toko sepeda Gemilang memberi diskon: A Rp4.800.000 (15%), B Rp4.200.000 (5%), C Rp4.000.000 (10%), D Rp3.800.000 (5%), E Rp3.600.000 (10%). Tentukan Setuju atau Tidak Setuju!",o:["Uang untuk membayar sepeda A lebih banyak dari sepeda B.","Uang untuk membayar sepeda B lebih banyak dari sepeda C.","Uang untuk membayar sepeda C lebih banyak dari sepeda D.","Uang untuk membayar sepeda A lebih banyak dari sepeda C.","Uang untuk membayar sepeda D lebih banyak dari sepeda E."],a:[0,0,1,0,0],e:"Harga bayar: A = 85% × 4.800.000 = 4.080.000; B = 95% × 4.200.000 = 3.990.000; C = 90% × 4.000.000 = 3.600.000; D = 95% × 3.800.000 = 3.610.000; E = 90% × 3.600.000 = 3.240.000. Hanya C &gt; D yang salah (3.600.000 &lt; 3.610.000)."},
{b:"Bilangan",t:"tf",l:["Tepat","Tidak Tepat"],q:"Jarak A–B = 75.000 km, A–C = 80.000 km, C–D = 95.000 km, A–F = 110.000 km. Tentukan Tepat atau Tidak Tepat!",o:["Jarak kota A ke kota F adalah 1,1 × 10⁴ km.","Jarak kota A ke kota C adalah 8 × 10⁵ km.","Jarak kota A ke kota B adalah 7,5 × 10⁴ km.","Jarak kota C ke kota D adalah 9,5 × 10⁵ km.","Selisih jarak A–B dan C–D adalah 2 × 10⁵ km."],a:[1,1,0,1,1],e:"110.000 = 1,1 × 10⁵; 80.000 = 8 × 10⁴; 75.000 = 7,5 × 10⁴ ✓; 95.000 = 9,5 × 10⁴; selisih 95.000 − 75.000 = 20.000 = 2 × 10⁴."},
{b:"SPLTV & Program Linear",t:"m",q:"Diketahui sistem persamaan x + 5y = 14 dan 3x − 2y = 8. Centang nilai yang <b>benar</b>! (boleh lebih dari satu)",o:["Nilai 3x + y = 12","Nilai x + 4y = 14","Nilai 4x + y = 18","Nilai 5x − 2y = 16","Nilai 8x + y = 34"],a:[2,3,4],e:"Eliminasi x: 3(x + 5y = 14) − (3x − 2y = 8) → 17y = 34, y = 2, x = 4. Cek: 3x + y = 14 ✗; x + 4y = 12 ✗; 4x + y = 18 ✓; 5x − 2y = 16 ✓; 8x + y = 34 ✓."},
{b:"SPLTV & Program Linear",t:"pg",q:"Lahan parkir seluas 800 m² hanya mampu menampung 64 bus dan mobil. Sebuah mobil menghabiskan tempat 6 m² dan bus 24 m². Biaya parkir Rp1.500/mobil dan Rp2.500/bus. Pemilik berharap penghasilan maksimum. Model matematikanya adalah ....",o:["x + y ≥ 64; 6x + 24y ≤ 800; x ≥ 0; y ≥ 0","x + y ≥ 64; 6x + 24y ≥ 800; x ≥ 0; y ≥ 0","x + y ≤ 64; 6x + 24y ≥ 800; x ≥ 0; y ≥ 0","x + y ≤ 64; 24x + 6y ≤ 800; x ≥ 0; y ≥ 0","x + y ≤ 64; 6x + 24y ≤ 800; x ≥ 0; y ≥ 0"],a:4,e:"Misal x = mobil, y = bus. Daya tampung maksimal 64 kendaraan → x + y ≤ 64. Luas lahan maksimal 800 m² → 6x + 24y ≤ 800. Jumlah kendaraan tidak negatif → x ≥ 0, y ≥ 0."},
{b:"SPLTV & Program Linear",t:"pg",q:"Salsa membeli 3 buku tulis, 1 pena, 2 pensil seharga Rp11.000. Yanti membeli 2 buku tulis, 3 pena, 1 pensil seharga Rp14.000. Mita membeli 1 buku tulis, 2 pena, 3 pensil seharga Rp11.000. Niken membeli 2 buku tulis, 1 pena, 1 pensil. Uang yang harus dikeluarkan Niken adalah ....",o:["Rp6.000,00","Rp7.000,00","Rp8.000,00","Rp9.000,00","Rp10.000,00"],a:2,e:"Misal buku b, pena p, pensil q (ribuan). Jumlahkan ketiga persamaan: 6(b + p + q) = 36 → b + p + q = 6. Dari persamaan pertama: 2b + q = 5; dari ketiga: b + 2q = 4 → b = 2, q = 1, p = 3. Niken: 2b + p + q = 4 + 3 + 1 = 8 → Rp8.000."},
{b:"Fungsi",t:"pg",q:"Fungsi f(x) = (1 − 8x)/(10 + 5x) memiliki invers ....",o:["f⁻¹(x) = (5 − 10x)/(x − 8)","f⁻¹(x) = (5 − 10x)/(x + 8)","f⁻¹(x) = (1 − 10x)/(5x − 8)","f⁻¹(x) = (1 − 10x)/(5x + 8)","f⁻¹(x) = (1 + 10x)/(5x + 8)"],a:3,e:"Misal y = (1 − 8x)/(10 + 5x) → 10y + 5xy = 1 − 8x → x(5y + 8) = 1 − 10y → x = (1 − 10y)/(5y + 8). Jadi f⁻¹(x) = (1 − 10x)/(5x + 8)."},
{b:"Fungsi",t:"tf",l:["Tepat","Tidak Tepat"],q:"Diketahui f(x) = 2 − 7x dan g(x) = 4x + 8. Tentukan Tepat atau Tidak Tepat!",o:["Fungsi komposisi (f ∘ g)(x) = −28x − 54.","Nilai (f ∘ g)(0) adalah −54.","Nilai (f ∘ g)(1) adalah −82.","Fungsi komposisi (g ∘ f)(x) = −16 − 28x.","Nilai (g ∘ f)(1) adalah −44."],a:[0,0,0,1,1],e:"(f∘g)(x) = 2 − 7(4x + 8) = −28x − 54 ✓; (f∘g)(0) = −54 ✓; (f∘g)(1) = −82 ✓. (g∘f)(x) = 4(2 − 7x) + 8 = 16 − 28x (bukan −16 − 28x); (g∘f)(1) = −12 (bukan −44)."},
{b:"Peluang",t:"tf",l:["Setuju","Tidak Setuju"],q:"Di dalam kotak ada 2 bola merah, 6 bola putih, dan 6 bola biru. Seseorang mengambil dua bola berurutan satu per satu tanpa pengembalian. Tentukan Setuju atau Tidak Setuju!",o:["Peluang terambil keduanya bola putih 35/91.","Peluang terambil keduanya bola merah 1/91.","Peluang terambil keduanya bola biru 35/91.","Peluang bola pertama putih dan bola kedua merah 3/91.","Peluang bola pertama putih dan bola kedua biru 9/91."],a:[1,0,1,1,1],e:"Total 14 bola. Putih–putih = 6/14 × 5/13 = 15/91 (bukan 35/91). Merah–merah = 2/14 × 1/13 = 1/91 ✓. Biru–biru = 15/91. Putih–merah = 6/14 × 2/13 = 6/91. Putih–biru = 6/14 × 6/13 = 18/91."},
{b:"Barisan & Deret",t:"pg",q:"Di antara bilangan 7 dan 47 disisipkan 4 bilangan sehingga membentuk barisan aritmetika. Beda barisan yang terbentuk adalah ....",o:["6","7","8","9","10"],a:2,e:"Sisip 4 bilangan → ada 5 selisih. b = (47 − 7)/5 = 8. Barisannya 7, 15, 23, 31, 39, 47."},
{b:"Barisan & Deret",t:"pg",q:"Sebuah bola dijatuhkan dari ketinggian 3 m. Tinggi pantulan bola adalah 4/5 dari ketinggian sebelumnya. Panjang lintasan bola (sampai berhenti) adalah ..... m",o:["21","27","27½","27¾","28½"],a:1,e:"Lintasan = turun awal + 2 × jumlah pantulan = 3 + 2 × (3 · 4/5)/(1 − 4/5) = 3 + 2 × (12/5)/(1/5) = 3 + 24 = 27 m."},
{b:"Barisan & Deret",t:"tf",l:["Tepat","Tidak Tepat"],q:"Sandra menabung Rp9.000.000,00 di koperasi dengan bunga majemuk 5% per semester. Tentukan Tepat atau Tidak Tepat!",o:["Uang tabungan setelah 1 tahun adalah Rp9.922.500,00.","Uang tabungan setelah 3 semester adalah Rp10.418.625,00.","Uang tabungan setelah 2 tahun adalah Rp11.044.025,00.","Uang tabungan setelah 5 semester adalah Rp11.125.326,75.","Uang tabungan setelah 3 tahun adalah Rp12.060.860,77."],a:[0,0,1,1,0],e:"M = 9.000.000 × (1,05)ⁿ, n dalam semester. n = 2: 9.922.500 ✓. n = 3: 10.418.625 ✓. n = 4: 10.939.556,25 (bukan 11.044.025). n = 5: 11.486.534,06 (bukan 11.125.326,75). n = 6: 12.060.860,77 ✓."},
{b:"Geometri",t:"pg",q:"Sebuah segitiga memiliki panjang sisi 21 cm, 14 cm, dan 15 cm. Segitiga itu termasuk segitiga ....",o:["lancip","siku-siku","tumpul","sama kaki","trapesium"],a:2,e:"Sisi terpanjang 21: 21² = 441, sedangkan 14² + 15² = 196 + 225 = 421. Karena 441 &gt; 421, segitiga tumpul."},
{b:"Geometri",t:"pg",q:"Bangun limas memiliki alas berbentuk persegi dengan panjang sisi 8 cm. Jika tinggi limas 18 cm, volume limas tersebut adalah ... cm³.",o:["664","524","384","274","184"],a:2,e:"V = ⅓ × luas alas × tinggi = ⅓ × 8 × 8 × 18 = 384 cm³."},
{b:"Geometri",t:"m",q:"Kubus ABCD.EFGH memiliki panjang rusuk 12√5 cm. Centang pernyataan yang <b>benar</b>! (boleh lebih dari satu)",o:["Jarak titik C ke titik H adalah 12√2 cm.","Jarak titik C ke titik F adalah 12√2 cm.","Jarak titik D ke titik G adalah 12√10 cm.","Jarak titik D ke titik H adalah 12√5 cm.","Jarak titik C ke bidang ADHE adalah 12√5 cm."],a:[2,3,4],e:"Diagonal sisi = rusuk × √2 = 12√5 · √2 = 12√10. C–H dan C–F adalah diagonal sisi (12√10, bukan 12√2); D–G juga diagonal sisi ✓. D–H adalah rusuk = 12√5 ✓. Jarak C ke bidang ADHE = panjang CD = 12√5 ✓."},
{b:"Geometri",t:"pg",q:"Limas segiempat beraturan T.ABCD dengan AB = BC = 4 cm dan tinggi limas 6 cm. Jarak titik B ke garis TD adalah ... cm.",o:["(4/3)√3","(8/3)√6","(12/5)√5","(12/17)√17","(12/11)√22"],a:4,e:"Koordinat: A(0,0,0), B(4,0,0), C(4,4,0), D(0,4,0), T(2,2,6). Arah TD ∥ d = (1,−1,3), |d| = √11. DB = (4,−4,0). DB × d = (−12,−12,0), panjang 12√2. Jarak = 12√2/√11 = (12/11)√22."},
{b:"Trigonometri",t:"pg",q:"Tongkat sepanjang 6 m disandarkan di tembok. Jika jarak antara pangkal tongkat dengan tembok adalah 3 meter, nilai sinus sudut antara pangkal tongkat dengan tanah adalah ....",o:["½","½√2","½√3","⅔","1"],a:2,e:"Misal sudut α antara tongkat dan tanah: cos α = 3/6 = ½ → α = 60°. Jadi sin α = sin 60° = ½√3."},
{b:"Trigonometri",t:"m",q:"Segitiga ABC siku-siku di B, AB = 12 cm, BC = 8 cm. Centang pernyataan yang <b>benar</b>! (boleh lebih dari satu)",o:["Nilai sin A = 1/2.","Nilai cos A = √3/2.","Nilai sec A = √13/3.","Nilai cosec A = √13/2.","Nilai cot A = 2."],a:[2,3],e:"AC = √(12² + 8²) = √208 = 4√13. sin A = 8/(4√13) = 2/√13; cos A = 12/(4√13) = 3/√13. sec A = √13/3 ✓; cosec A = √13/2 ✓; cot A = 12/8 = 3/2 (bukan 2)."},
{b:"Trigonometri",t:"m",q:"Diketahui sin A = √5/4 dan sudut A di kuadran I. Centang pernyataan yang <b>benar</b>! (boleh lebih dari satu)",o:["Nilai cos A adalah √11/4.","Nilai tan A adalah √55/4.","Nilai ½ cos A adalah √11/2.","Nilai ½ tan A adalah √55/2.","Nilai cosec A adalah 4√5/5."],a:[0,4],e:"Sisi depan √5, miring 4, samping √(16 − 5) = √11. cos A = √11/4 ✓; tan A = √5/√11 = √55/11 ✗; ½ cos A = √11/8 ✗; ½ tan A = √55/22 ✗; cosec A = 4/√5 = 4√5/5 ✓."},
{b:"Statistika",t:"tf",l:["Benar","Salah"],q:"Data tinggi (cm) – frekuensi: 155–159 (5), 160–164 (12), 165–169 (16), 170–174 (6), 175–179 (2). Tentukan Benar atau Salah!",o:["Banyak kelas ada 5.","Batas bawah kelas pertama adalah 155.","Tepi bawah kelas pertama adalah 150,5.","Batas atas kelas pertama adalah 159,5.","Tepi bawah kelas kedua adalah 159,5."],a:[0,0,1,1,0],e:"Ada 5 kelas ✓. Batas bawah kelas I = 155 ✓. Tepi bawah = batas bawah − 0,5 = 154,5 (bukan 150,5). Batas atas kelas I = 159 (159,5 adalah tepi atas). Tepi bawah kelas II = 160 − 0,5 = 159,5 ✓."},
{b:"Statistika",t:"pg",q:"Data diameter tanaman (cm) – frekuensi: 11–20 (3), 21–30 (8), 31–40 (12), 41–50 (16), 51–60 (3), 61–70 (1). Modus dari data tersebut adalah ....",o:["41,78","42,14","42,85","43,05","43,18"],a:2,e:"Kelas modus 41–50 (f = 16). Tepi bawah = 40,5; d₁ = 16 − 12 = 4; d₂ = 16 − 3 = 13; p = 10. Mo = 40,5 + 10 · 4/(4 + 13) = 40,5 + 2,35 ≈ 42,85."},
{b:"Statistika",t:"pg",q:"Diketahui data: 4, 5, 5, 6, 7, 8, 8, 9, 9, 10. Jangkauan antarkuartil data tersebut adalah ....",o:["2","2,5","3","3,5","4"],a:4,e:"n = 10. Q₁ = median 4, 5, 5, 6, 7 = 5. Q₃ = median 8, 8, 9, 9, 10 = 9. Jangkauan antarkuartil = Q₃ − Q₁ = 9 − 5 = 4."},
{b:"Peluang",t:"pg",q:"Di dalam kotak terdapat 8 bola bernomor 1 sampai 8. Seseorang mengambil 1 bola secara acak. Peluang terambil bola nomor 1 atau nomor genap adalah ....",o:["1/8","1/4","1/2","2/3","5/8"],a:4,e:"Kejadian yang diinginkan: {1, 2, 4, 6, 8} = 5 kejadian dari 8. Peluang = 5/8."},

function kisi(){var m={},k;Q.forEach(function(q,i){(m[q.b]=m[q.b]||[]).push(i+1)});var h='<table class="kt"><tr><th>Topik materi</th><th>Nomor soal</th><th>Jumlah</th></tr>';for(k in m)h+='<tr><td>'+k+'</td><td>'+m[k].join(", ")+'</td><td>'+m[k].length+'</td></tr>';return h+'<tr><td><b>Total</b></td><td></td><td><b>'+N+'</b></td></tr></table>'}
function reset(){ans=Q.map(function(q){return q.t=="pg"?null:q.t=="m"?[]:q.o.map(function(){return null})});flag=Q.map(function(){return false});cur=0}
function isAns(i){var q=Q[i],a=ans[i];return q.t=="pg"?a!==null:q.t=="m"?a.length>0:a.some(function(v){return v!==null})}
function ok(i){var q=Q[i],a=ans[i];if(q.t=="pg")return a===q.a;if(q.t=="m")return JSON.stringify(a.slice().sort())==JSON.stringify(q.a);return a.every(function(v,k){return v===q.a[k]})}
function hist(){try{return JSON.parse(localStorage.getItem(H)||"[]")}catch(e){return[]}}
function save(r){try{var h=hist();h.unshift(r);localStorage.setItem(H,JSON.stringify(h.slice(0,8)))}catch(e){}}
function fmt(s){var m=Math.floor(s/60),x=s%60;return(m<10?"0":"")+m+":"+(x<10?"0":"")+x}
function start(){reset();left=DUR;var nm=$("#nm");if(nm){name=nm.value.trim();kls=$("#kl").value.trim();sch=$("#sc").value.trim();if(!name||!kls||!sch){$("#er").textContent="Lengkapi nama, kelas, dan asal sekolah terlebih dahulu.";return}}clearInterval(tm);tm=setInterval(function(){left--;var e=$("#tm");if(e)e.textContent=fmt(left);if(left<=0)finish()},1000);show()}
function home(){clearInterval(tm);var h=hist();
$("#app").innerHTML='<div class="wrap"><div class="card"><div class="hero"><span class="tag">TKA 2026 · SMA/MA dan SMK/MAK</span><h1>TRY OUT<br>MATEMATIKA WAJIB<br>TKA 1</h1></div>'+
'<p>📝 <b>'+N+' soal</b> &nbsp;⏱ <b>90 menit</b> &nbsp;📚 10 topik materi</p><p class="mu">Jenis soal: pilihan ganda, pilihan ganda kompleks (centang lebih dari satu), dan tabel Benar/Salah. Soal pilihan ganda kompleks dan tabel dinilai benar jika <b>semua</b> pilihan tepat. Setelah selesai tersedia skor, kunci jawaban, dan pembahasan setiap soal. Try out ini dapat dikerjakan berulang kali.</p>'+
'<h2>Data peserta</h2><label class="lb">Nama lengkap</label><input type="text" id="nm" maxlength="50" value="'+esc(name)+'"><label class="lb">Kelas</label><input type="text" id="kl" maxlength="20" value="'+esc(kls)+'"><label class="lb">Asal sekolah</label><input type="text" id="sc" maxlength="60" value="'+esc(sch)+'"><p id="er" style="color:var(--bad);margin:8px 0 0"></p><p><button class="btn" onclick="start()">Mulai Try Out</button></p></div><div class="card"><h2>Kisi-kisi soal</h2>'+kisi()+'</div>'+
(h.length?'<div class="card"><h2>Riwayat percobaan</h2>'+h.map(function(r){return'<div class="mu">'+r.d+' · '+(r.n?r.n+' · ':'')+'<b>Skor '+r.s+'</b> ('+r.c+'/'+N+' benar)</div>'}).join("")+'</div>':'')+'</div>'}
function pick(i,k,v){var q=Q[i];if(q.t=="pg")ans[i]=k;else if(q.t=="m"){var p=ans[i].indexOf(k);p<0?ans[i].push(k):ans[i].splice(p,1)}else ans[i][k]=v;show()}
function opts(i,rev){var q=Q[i],a=ans[i],h="",c;
if(q.t=="pg")q.o.forEach(function(x,k){c=rev?(k==q.a?"ok":a===k?"bad":""):(a===k?"sel":"");h+='<div class="op '+c+'" '+(rev?'':'onclick="pick('+i+','+k+')"')+'><b>'+L[k]+'</b><span>'+x+'</span></div>'});
else if(q.t=="m")q.o.forEach(function(x,k){var on=a.indexOf(k)>=0,r=q.a.indexOf(k)>=0;c=rev?(r&&on?"ok":r?"miss":on?"bad":""):(on?"sel":"");h+='<div class="op '+c+'" '+(rev?'':'onclick="pick('+i+','+k+')"')+'><b>'+(on?"✓":"")+'</b><span>'+x+(rev&&r&&!on?' <em>(seharusnya dicentang)</em>':'')+'</span></div>'});
else q.o.forEach(function(x,k){h+='<div class="row"><div>'+(k+1)+'. '+x+'</div><div class="ch">'+q.l.map(function(lb,v){c=rev?(q.a[k]==v?"ok":a[k]===v?"bad":""):(a[k]===v?"sel":"");return'<span class="op '+c+'" '+(rev?'':'onclick="pick('+i+','+k+','+v+')"')+'>'+lb+'</span>'}).join("")+'</div></div>'});
return h}
function hint(q){return q.t=="m"?"Pilih semua jawaban yang benar.":q.t=="tf"?"Pilih satu jawaban untuk setiap pernyataan.":"Pilih satu jawaban."}
function show(){var q=Q[cur],d=ans.filter(function(_,i){return isAns(i)}).length;
var g=Q.map(function(_,i){return'<button class="gn '+(isAns(i)?"d ":"")+(flag[i]?"f ":"")+(i==cur?"c":"")+'" onclick="cur='+i+';show()">'+(i+1)+'</button>'}).join("");
$("#app").innerHTML='<div class="top"><span><b>Soal '+(cur+1)+'/'+N+'</b> · terjawab '+d+'</span><span class="tm" id="tm">'+fmt(left)+'</span><button class="btn g" onclick="ask()">Selesai</button></div><div class="wrap"><div class="grid">'+g+'</div><div class="card"><span class="tag">'+q.b+'</span> '+(flag[cur]?'<span class="tag" style="background:var(--was);color:var(--wa)">Ragu-ragu</span>':'')+'<div class="q">'+q.q+'</div><div class="mu">'+hint(q)+'</div>'+opts(cur,false)+'</div><div class="nav"><button class="btn g" onclick="cur--;show()" '+(cur==0?"disabled":"")+'>← Sebelumnya</button><button class="btn w" onclick="flag[cur]=!flag[cur];show()">'+(flag[cur]?"Hapus ragu":"Ragu-ragu")+'</button>'+(cur<N-1?'<button class="btn" onclick="cur++;show()">Selanjutnya →</button>':'<button class="btn" onclick="ask()">Selesai ✓</button>')+'</div></div>';window.scrollTo(0,0)}
function ask(){var u=N-ans.filter(function(_,i){return isAns(i)}).length,f=flag.filter(Boolean).length,o=document.createElement("div");o.className="ov";o.id="ov";
o.innerHTML='<div class="card"><h2>Akhiri try out?</h2><p>'+(u?'Masih ada <b>'+u+'</b> soal belum dijawab. ':'Semua soal sudah dijawab. ')+(f?'Ada <b>'+f+'</b> soal ragu-ragu. ':'')+'</p><div class="nav"><button class="btn g" onclick="$(\'#ov\').remove()">Lanjut mengerjakan</button><button class="btn" onclick="finish()">Ya, selesai</button></div></div>';document.body.appendChild(o)}
function finish(){clearInterval(tm);var o=$("#ov");if(o)o.remove();var c=0,bs={};Q.forEach(function(q,i){var r=ok(i);if(r)c++;bs[q.b]=bs[q.b]||[0,0];bs[q.b][1]++;if(r)bs[q.b][0]++});
var s=Math.round(c/N*100),dt=new Date().toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"});save({d:dt,n:name+" ("+kls+")",s:s,c:c});
var used=DUR-Math.max(left,0);
$("#app").innerHTML='<div class="wrap"><div class="card"><span class="tag">Hasil Try Out</span><h1>'+(name?name+', ':'')+(s>=75?'hebat! 🎉':s>=50?'bagus, terus latihan 💪':'jangan menyerah, pelajari pembahasannya 📖')+'</h1><div class="score">'+s+'</div><p class="mu">'+kls+' · '+sch+'<br>'+c+' dari '+N+' soal benar · waktu '+fmt(used)+'</p></div>'+
'<div class="card"><h2>Penguasaan per topik</h2>'+Object.keys(bs).map(function(k){var p=Math.round(bs[k][0]/bs[k][1]*100);return'<div style="margin:10px 0"><div style="display:flex;justify-content:space-between"><span>'+k+'</span><span class="mu">'+bs[k][0]+'/'+bs[k][1]+'</span></div><div class="bar"><i style="width:'+p+'%"></i></div></div>'}).join("")+'</div>'+
'<div class="nav" style="margin-bottom:14px"><button class="btn" onclick="start2()">🔁 Ulangi Try Out</button><button class="btn g" onclick="home()">Beranda</button></div><h2>Kunci jawaban &amp; pembahasan</h2><div class="grid">'+Q.map(function(_,i){return'<button class="gn '+(ok(i)?"ok":"bad")+'" onclick="document.getElementById(\'r'+i+'\').scrollIntoView({behavior:\'smooth\'})">'+(i+1)+'</button>'}).join("")+'</div>'+
Q.map(function(q,i){var key=q.t=="pg"?L[q.a]:q.t=="m"?q.a.map(function(k){return L[k]?(k+1):0}).map(function(n){return"pernyataan "+n}).join(", "):q.a.map(function(v,k){return(k+1)+" = "+q.l[v]}).join("; ");
return'<div class="card" id="r'+i+'"><span class="tag">Soal '+(i+1)+' · '+q.b+'</span> <span class="tag" style="background:var(--'+(ok(i)?'oks':'bads')+');color:var(--'+(ok(i)?'ok':'bad')+')">'+(ok(i)?'Benar':isAns(i)?'Salah':'Tidak dijawab')+'</span><div class="q">'+q.q+'</div>'+opts(i,true)+'<p><b>Kunci:</b> '+key+'</p><div class="ex"><b>Pembahasan:</b> '+q.e+'</div></div>'}).join("")+
'<div class="nav"><button class="btn" onclick="start2()">🔁 Ulangi Try Out</button><button class="btn g" onclick="window.scrollTo(0,0)">↑ Ke atas</button></div></div>';window.scrollTo(0,0)}
function start2(){start()}
reset();home();
</script>
</body>
</html>
